<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff" />

  <!-- Usuario -->
  <rect x="30" y="230" width="150" height="70" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5" />
  <text x="105" y="260" text-anchor="middle" font-size="14" font-weight="bold">Usuário</text>
  <text x="105" y="280" text-anchor="middle" font-size="12">Navegador</text>

  <!-- Dev -->
  <rect x="30" y="20" width="170" height="80" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="1.5" />
  <text x="115" y="48" text-anchor="middle" font-size="14" font-weight="bold">Dev</text>
  <text x="115" y="66" text-anchor="middle" font-size="12">az CLI + GitHub</text>
  <text x="115" y="84" text-anchor="middle" font-size="11">Actions / webapp deploy</text>

  <!-- Resource group box -->
  <rect x="260" y="20" width="680" height="470" rx="14" fill="#fffbe6" stroke="#ffd400" stroke-width="2" />
  <text x="280" y="48" font-size="14" font-weight="bold" fill="#5c4d00">Microsoft Azure — Resource Group rg-dimdim-*</text>

  <!-- App Service -->
  <rect x="300" y="230" width="190" height="90" rx="10" fill="#1a1a1a" />
  <text x="395" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffd400">App Service</text>
  <text x="395" y="282" text-anchor="middle" font-size="12" fill="#ffffff">ASP.NET Core MVC</text>
  <text x="395" y="299" text-anchor="middle" font-size="11" fill="#ffffff">Linux · Plano B1</text>

  <!-- Azure SQL -->
  <rect x="620" y="150" width="200" height="90" rx="10" fill="#0078d4" />
  <text x="720" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Azure SQL Database</text>
  <text x="720" y="202" text-anchor="middle" font-size="12" fill="#ffffff">CLIENTE / TRANSACAO</text>
  <text x="720" y="219" text-anchor="middle" font-size="11" fill="#ffffff">Tier Basic</text>

  <!-- Application Insights -->
  <rect x="620" y="300" width="200" height="80" rx="10" fill="#5c2d91" />
  <text x="720" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Application</text>
  <text x="720" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Insights</text>
  <text x="720" y="368" text-anchor="middle" font-size="11" fill="#ffffff">Telemetria da app</text>

  <!-- Log Analytics -->
  <rect x="620" y="420" width="200" height="60" rx="10" fill="#8661c5" />
  <text x="720" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Log Analytics</text>
  <text x="720" y="463" text-anchor="middle" font-size="11" fill="#ffffff">Workspace</text>

  <!-- Arrows -->
  <line x1="180" y1="265" x2="298" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="235" y="255" text-anchor="middle" font-size="11">HTTPS</text>

  <line x1="200" y1="60" x2="300" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="250" y="140" text-anchor="middle" font-size="11" transform="rotate(55 250 140)">deploy</text>

  <line x1="490" y1="255" x2="618" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="220" text-anchor="middle" font-size="11">EF Core · TCP 1433</text>

  <line x1="490" y1="285" x2="618" y2="335" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="320" text-anchor="middle" font-size="11">Telemetria</text>

  <line x1="720" y1="380" x2="720" y2="418" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

  <text x="600" y="505" text-anchor="middle" font-size="12" fill="#5c4d00">DimDim Carteira — arquitetura de implantação na nuvem (Azure)</text>
</svg>
